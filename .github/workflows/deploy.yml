name: ExoSentinel — Fetch & Deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 12 * * 0'  # Weekly on Sunday at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fetch fresh security events from CPW API
      - name: Fetch security events
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/api-call.js
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

      # Generate AI intelligence brief using GitHub Models
      - name: Generate intelligence brief
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/generate-brief.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commit updated data files
      - name: Commit data updates
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ExoSentinel"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "intel update — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Deploy to GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Post weekly summary to Twitter (optional)
      # - name: Post to Twitter
      #   if: github.event_name == 'schedule'
      #   run: node scripts/post-twitter.js
      #   env:
      #     X_API_KEY: ${{ secrets.X_API_KEY }}
      #     X_API_SECRET: ${{ secrets.X_API_SECRET }}
      #     X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      #     X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
